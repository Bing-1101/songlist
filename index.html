<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>亿万伏特Volt的点歌单</title>
<style>
  :root{
    box-sizing: border-box;
    --bg: #16101F;
    --bg-elevated: #201731;
    --bg-row: #1B1329;
    --border: rgba(243,238,249,0.09);
    --text: #F3EEF9;
    --text-muted: #AC9FC9;
    --accent: #FFB33E;
    --accent-2: #FF5E7E;
    --focus: #FFD98A;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing: border-box; }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body{ height: 100%; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue",
                 "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(60% 50% at 15% -10%, rgba(255,179,62,0.16), transparent 60%),
      radial-gradient(50% 40% at 100% 0%, rgba(255,94,126,0.14), transparent 60%);
    background-attachment: fixed;
  }

  .page{
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 18px 64px;
  }

  header.hero{ padding: 6px 4px 22px; }
  h1{
    font-size: clamp(26px, 6vw, 36px);
    line-height: 1.25;
    margin: 0 0 8px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .hint{
    color: var(--text-muted);
    font-size: 14.5px;
    line-height: 1.6;
    margin: 0;
    max-width: 46ch;
  }

  /* ---- 一级：曲风分类卡片 ---- */
  .cat-grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 22px;
  }
  .cat-card{
    grid-column: span 1;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 16px;
    text-align: left;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
    transition: border-color .15s ease, transform .1s ease;
  }
  .cat-card:hover{ border-color: var(--accent); }
  .cat-card:active{ transform: scale(0.98); }
  .cat-card:first-child{ grid-column: span 2; }
  .cat-emoji{ font-size: 26px; margin-bottom: 10px; display: block; }
  .cat-name{ font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .cat-count{ font-size: 13px; color: var(--text-muted); }

  /* ---- 二级：分类内页面 ---- */
  .cat-header{
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
  }
  .back-btn{
    border: 1px solid var(--border);
    background: rgba(243,238,249,0.05);
    color: var(--text);
    font-size: 13.5px;
    font-family: inherit;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    flex: none;
  }
  .back-btn:active{ transform: scale(0.96); }
  .cat-header h2{
    font-size: 21px;
    font-weight: 800;
    margin: 0;
  }

  .search-wrap{
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: linear-gradient(var(--bg) 78%, transparent);
    padding: 14px 0 14px;
    margin: 0 -4px;
    padding-left: 4px;
    padding-right: 4px;
  }
  .search-box{
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 16px;
  }
  .search-box svg{ flex: none; opacity: 0.6; }
  .search-box input{
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
  }
  .search-box input::placeholder{ color: var(--text-muted); }
  .search-box button.clear{
    display: none;
    border: none;
    background: rgba(243,238,249,0.1);
    color: var(--text-muted);
    width: 22px; height: 22px;
    border-radius: 50%;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }
  .search-box.has-text button.clear{ display: block; }

  .meta-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 2px 4px;
    color: var(--text-muted);
    font-size: 13.5px;
  }
  .meta-actions{ display: flex; gap: 8px; }
  .meta-row button.toggle-all{
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
  }
  .meta-row button.toggle-all:active{ transform: scale(0.97); }

  .groups{ margin-top: 10px; }

  .group{ border-bottom: 1px solid var(--border); }
  .group-head{
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 15px 6px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 16.5px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
  }
  .group-head .left{ display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .group-head .name{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group-head .count{ color: var(--text-muted); font-weight: 500; font-size: 13px; flex: none; }
  .group-head .chev{ flex: none; width: 18px; height: 18px; color: var(--text-muted); transition: transform .18s ease; }
  .group.open .group-head .chev{ transform: rotate(180deg); }

  .song-list{ display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s ease; }
  .group.open .song-list{ grid-template-rows: 1fr; }
  .song-list-inner{ overflow: hidden; }

  .song-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 6px 11px 18px;
    border-radius: 10px;
  }
  .song-row.flat{ padding-left: 6px; }
  .song-row + .song-row{ margin-top: 2px; }
  .song-row:hover{ background: var(--bg-row); }
  .song-title{
    font-size: 15.5px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .song-title mark{ background: rgba(255,179,62,0.35); color: inherit; border-radius: 3px; padding: 0 1px; }
  .song-tag{
    flex: none;
    font-size: 11.5px;
    color: var(--accent);
    border: 1px solid rgba(255,179,62,0.35);
    background: rgba(255,179,62,0.08);
    border-radius: 999px;
    padding: 2px 8px;
    margin-right: 8px;
  }
  .song-row.flat .song-title{ display: flex; align-items: center; gap: 0; }
  .copy-btn{
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: rgba(243,238,249,0.04);
    color: var(--text-muted);
    font-size: 13px;
    font-family: inherit;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .copy-btn:hover{ border-color: var(--accent-2); color: var(--text); }
  .copy-btn:active{ transform: scale(0.96); }
  .copy-btn.copied{ border-color: var(--accent); color: var(--accent); background: rgba(255,179,62,0.1); }
  .copy-btn svg{ width: 14px; height: 14px; }

  .empty-state{ display: none; text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state.show{ display: block; }
  .empty-state .big{ font-size: 32px; margin-bottom: 10px; }

  .toast{
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 12px);
    background: #2A1F40;
    border: 1px solid rgba(255,179,62,0.4);
    color: var(--text);
    padding: 11px 18px;
    border-radius: 999px;
    font-size: 13.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    z-index: 20;
    white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .toast.show{ opacity: 1; transform: translate(-50%, 0); }

  .blind-overlay{
    position: fixed; inset: 0;
    background: rgba(10,7,16,0.72);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 50;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  .blind-overlay.show{ opacity: 1; pointer-events: auto; }
  .blind-card{
    width: 100%; max-width: 360px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px 24px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .blind-emoji{ font-size: 34px; margin-bottom: 6px; }
  .blind-label{ color: var(--text-muted); font-size: 13px; margin-bottom: 18px; }
  .blind-spin{ font-size: 21px; font-weight: 800; min-height: 30px; margin-bottom: 4px; color: var(--accent); }
  .blind-tag{ color: var(--text-muted); font-size: 14px; min-height: 20px; margin-bottom: 20px; }
  .blind-actions{ display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .blind-actions button{ border: none; border-radius: 999px; padding: 10px 18px; font-size: 14px; font-family: inherit; cursor: pointer; }
  .blind-copy{ background: var(--accent); color: #241705; font-weight: 700; }
  .blind-copy.copied{ background: #5CCB8C; color: #0C2416; }
  .blind-again{ background: rgba(243,238,249,0.08); color: var(--text); }
  .blind-close{ background: transparent; color: var(--text-muted); }

  footer{ text-align: center; color: var(--text-muted); font-size: 12.5px; padding: 30px 10px 6px; opacity: 0.7; }
  a, button{ -webkit-tap-highlight-color: transparent; }
  :focus-visible{ outline: 2px solid var(--focus); outline-offset: 2px; }
  .hidden{ display: none !important; }

  @media (min-width: 640px){
    .page{ padding-top: 44px; }
    .song-title{ font-size: 16px; }
  }
</style>
</head>

<div class="page">

  <header class="hero">
    <h1>亿万伏特Volt的点歌单</h1>
    <p class="hint" id="heroHint">先选一个曲风，再挑歌～点「复制」把歌名粘到弹幕里发出来就行</p>
  </header>

        <input id="homeSearchInput" type="text" inputmode="search" placeholder="搜索全部歌曲的歌名或歌手…" autocomplete="off">
        <button class="clear" id="homeClearBtn" aria-label="清空">✕</button>
      </div>
    </div>

    <div class="meta-row">
      <span id="homeStatLine">共 84 首 · 5 个曲风</span>
      <span class="meta-actions">
        <button class="toggle-all" id="homeBlindBoxBtn">🎁 盲盒抽歌</button>
      </span>
    </div>

    <div class="groups hidden" id="homeResults"></div>
    <div class="empty-state" id="homeEmptyState">
      <div class="big">🎧</div>
      <div>没找到相关的歌，换个关键词试试</div>
    </div>

    <div class="cat-grid" id="catGrid"></div>
  </div>

  <!-- 二级：分类内歌单 -->
  <div id="categoryView" class="hidden">
    <div class="cat-header">
      <button class="back-btn" id="backBtn">← 返回分类</button>
      <h2 id="catTitle"></h2>
    </div>

    <div class="search-wrap">
      <div class="search-box" id="searchBox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="searchInput" type="text" inputmode="search" placeholder="搜索歌名…" autocomplete="off">
        <button class="clear" id="clearBtn" aria-label="清空">✕</button>
      </div>
    </div>

    <div class="meta-row">
      <span id="statLine">共 0 首</span>
      <span class="meta-actions">
        <button class="toggle-all" id="blindBoxBtn">🎁 盲盒抽歌</button>
        <button class="toggle-all hidden" id="toggleAllBtn">展开全部</button>
      </span>
    </div>

    <div class="groups" id="groups"></div>

    <div class="empty-state" id="emptyState">
      <div class="big">🎧</div>
      <div>没找到相关的歌，换个关键词试试</div>
    </div>
  </div>

  <footer>共 <span id="footerCount">0</span> 首</footer>
</div>

<div class="toast" id="toast">已复制歌名</div>

<div class="blind-overlay" id="blindOverlay">
  <div class="blind-card">
    <div class="blind-emoji">🎁</div>
    <div class="blind-label" id="blindLabel">盲盒抽歌</div>
    <div class="blind-spin" id="blindSpinTitle">准备抽取…</div>
    <div class="blind-tag" id="blindSpinTag">&nbsp;</div>
    <div class="blind-actions">
      <button class="blind-copy" id="blindCopyBtn" type="button">复制点歌</button>
      <button class="blind-again" id="blindAgainBtn" type="button">再抽一次</button>
      <button class="blind-close" id="blindCloseBtn" type="button">关闭</button>
    </div>
  </div>
</div>

const groupsEl = document.getElementById('groups');
const searchInput = document.getElementById('searchInput');
const searchBox = document.getElementById('searchBox');
const clearBtn = document.getElementById('clearBtn');
const statLine = document.getElementById('statLine');
const footerCount = document.getElementById('footerCount');
const emptyState = document.getElementById('emptyState');
const toggleAllBtn = document.getElementById('toggleAllBtn');
const blindBoxBtn = document.getElementById('blindBoxBtn');
const toast = document.getElementById('toast');

let currentCategory = null;
let allExpanded = false;

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, query){
  if(!query) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if(idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0, idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+query.length)) + '</mark>' + escapeHtml(text.slice(idx+query.length));
}

// ---- 首页：跨分类搜索 ----
function renderHomeSearch(query){
  const q = (query || '').trim().toLowerCase();
  if(q === ''){
    catGrid.classList.remove('hidden');
    homeResults.classList.add('hidden');
    homeEmptyState.classList.remove('show');
    homeStatLine.textContent = `共 ${SONGS.length} 首 · ${CATEGORY_META.length} 个曲风`;
    return;
  }
  catGrid.classList.add('hidden');
  homeResults.classList.remove('hidden');
  homeResults.innerHTML = '';
  const matched = SONGS.filter(s =>
    s.title.toLowerCase().includes(q) || (s.artist && s.artist.toLowerCase().includes(q))
  );
  matched.forEach(song => {
    homeResults.appendChild(makeSongRow(song, q, true, true));
  });
  homeStatLine.textContent = `共 ${matched.length} 首匹配`;
  homeEmptyState.classList.toggle('show', matched.length === 0);
}

homeSearchInput.addEventListener('input', (e) => {
  homeSearchBox.classList.toggle('has-text', e.target.value.length > 0);
  renderHomeSearch(e.target.value);
});
homeClearBtn.addEventListener('click', () => {
  homeSearchInput.value = '';
  homeSearchBox.classList.remove('has-text');
  homeSearchInput.focus();
  renderHomeSearch('');
});

// ---- 首页：分类卡片 ----
function renderHome(){
  footerCount.textContent = SONGS.length;
  catGrid.innerHTML = '';
  CATEGORY_META.forEach(meta => {
    const count = SONGS.filter(s => s.category === meta.key).length;
    if(count === 0) return;
    const card = document.createElement('button');
    card.className = 'cat-card';
    card.innerHTML = `
      <span class="cat-emoji">${meta.emoji}</span>
      <div class="cat-name">${escapeHtml(meta.key)}</div>
      <div class="cat-count">${count} 首</div>
    `;
    card.addEventListener('click', () => openCategory(meta.key));
    catGrid.appendChild(card);
  });
}

function openCategory(key){
  currentCategory = key;
  catTitle.textContent = key;
  homeView.classList.add('hidden');
  categoryView.classList.remove('hidden');
  heroHint.textContent = '搜歌名，点「复制」把歌名粘到弹幕里发出来就行';
  searchInput.value = '';
  searchBox.classList.remove('has-text');
  allExpanded = false;
  const isRap = key === 'Rap';
  toggleAllBtn.classList.toggle('hidden', !isRap);
  toggleAllBtn.textContent = '展开全部';
  searchInput.placeholder = isRap ? '搜索歌名或歌手…' : '搜索歌名…';
  render('');
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

backBtn.addEventListener('click', () => {
  categoryView.classList.add('hidden');
  homeView.classList.remove('hidden');
  heroHint.textContent = '先选一个曲风，再挑歌～点「复制」把歌名粘到弹幕里发出来就行';
  currentCategory = null;
});

// ---- 分类内：分组渲染（仅 Rap 用） ----
function groupByArtist(list){
  const map = new Map();
  list.forEach(s => {
    const key = s.artist || '未知歌手';
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(s);
  });
  return map;
}

function makeSongRow(song, query, flat, showCategory){
  const row = document.createElement('div');
  row.className = 'song-row' + (flat ? ' flat' : '');
  const tagHtml = showCategory ? `<span class="song-tag">${escapeHtml(song.category)}</span>` : '';
  row.innerHTML = `
    <span class="song-title">${tagHtml}${highlight(song.title, query)}</span>
    <button class="copy-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      <span>复制</span>
    </button>
  `;
  const btn = row.querySelector('.copy-btn');
  btn.addEventListener('click', () => copySong(song, btn));
  return row;
}

function render(query){
  const q = (query || '').trim().toLowerCase();
  const inCategory = SONGS.filter(s => s.category === currentCategory);
  groupsEl.innerHTML = '';

  if(currentCategory === 'Rap'){
    const grouped = groupByArtist(inCategory);
    let totalShown = 0;
    let artistCountShown = 0;

    grouped.forEach((songs, artist) => {
      const artistMatches = artist.toLowerCase().includes(q);
      const filtered = q === '' ? songs : songs.filter(s =>
        s.title.toLowerCase().includes(q) || artistMatches
      );
      if(filtered.length === 0) return;

      artistCountShown++;
      totalShown += filtered.length;

      const groupDiv = document.createElement('div');
      groupDiv.className = 'group';
      const shouldOpen = q !== '' || allExpanded;
      if(shouldOpen) groupDiv.classList.add('open');

      const head = document.createElement('button');
      head.className = 'group-head';
      head.innerHTML = `
        <span class="left">
          <span class="name">${highlight(artist, artistMatches ? q : '')}</span>
          <span class="count">${filtered.length} 首</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      `;
      head.addEventListener('click', () => groupDiv.classList.toggle('open'));

      const listWrap = document.createElement('div');
      listWrap.className = 'song-list';
      const listInner = document.createElement('div');
      listInner.className = 'song-list-inner';

      filtered.forEach(song => {
        listInner.appendChild(makeSongRow(song, artistMatches ? '' : q, false));
      });

      listWrap.appendChild(listInner);
      groupDiv.appendChild(head);
      groupDiv.appendChild(listWrap);
      groupsEl.appendChild(groupDiv);
    });

    statLine.textContent = `共 ${totalShown} 首 · ${artistCountShown} 位歌手`;
    emptyState.classList.toggle('show', totalShown === 0);
  } else {
    const filtered = q === '' ? inCategory : inCategory.filter(s => s.title.toLowerCase().includes(q));
    filtered.forEach(song => {
      groupsEl.appendChild(makeSongRow(song, q, true));
    });
    statLine.textContent = `共 ${filtered.length} 首`;
    emptyState.classList.toggle('show', filtered.length === 0);
  }
}

function copySong(song, btn){
  const text = `点歌 ${song.title}`;
  const done = () => {
    showToast(`已复制「${song.title}」`);
    btn.classList.add('copied');
    btn.querySelector('span').textContent = '已复制';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.querySelector('span').textContent = '复制';
    }, 1400);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, cb){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    cb();
  }catch(e){
    showToast('复制失败，请手动选择歌名');
  }
}

let toastTimer;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
}

searchInput.addEventListener('input', (e) => {
  searchBox.classList.toggle('has-text', e.target.value.length > 0);
  render(e.target.value);
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchBox.classList.remove('has-text');
  searchInput.focus();
  render('');
});

toggleAllBtn.addEventListener('click', () => {
  allExpanded = !allExpanded;
  toggleAllBtn.textContent = allExpanded ? '收起全部' : '展开全部';
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('open', allExpanded));
});

// ---- 盲盒抽歌（全歌单范围抽取） ----
const blindOverlay = document.getElementById('blindOverlay');
const blindSpinTitle = document.getElementById('blindSpinTitle');
const blindSpinTag = document.getElementById('blindSpinTag');
const blindCopyBtn = document.getElementById('blindCopyBtn');
const blindAgainBtn = document.getElementById('blindAgainBtn');
const blindCloseBtn = document.getElementById('blindCloseBtn');
const blindLabel = document.getElementById('blindLabel');
let blindCurrentSong = null;
let blindSpinTimer = null;
let blindPool = SONGS;

function runBlindDraw(pool){
  blindPool = pool || SONGS;
  clearInterval(blindSpinTimer);
  blindCopyBtn.classList.remove('copied');
  blindCopyBtn.textContent = '复制点歌';
  const finalPick = blindPool[Math.floor(Math.random() * blindPool.length)];
  let ticks = 0;
  const maxTicks = 16;
  blindSpinTimer = setInterval(() => {
    const r = blindPool[Math.floor(Math.random() * blindPool.length)];
    blindSpinTitle.textContent = r.title;
    blindSpinTag.textContent = r.category;
    ticks++;
    if(ticks >= maxTicks){
      clearInterval(blindSpinTimer);
      blindCurrentSong = finalPick;
      blindSpinTitle.textContent = finalPick.title;
      blindSpinTag.textContent = finalPick.category;
    }
  }, 70);
}

homeBlindBoxBtn.addEventListener('click', () => {
  blindLabel.textContent = '盲盒抽歌 · 全部曲风';
  blindOverlay.classList.add('show');
  runBlindDraw(SONGS);
});

blindBoxBtn.addEventListener('click', () => {
  blindLabel.textContent = `盲盒抽歌 · ${currentCategory}`;
  blindOverlay.classList.add('show');
  const pool = SONGS.filter(s => s.category === currentCategory);
  runBlindDraw(pool);
});
blindAgainBtn.addEventListener('click', () => runBlindDraw(blindPool));
blindCloseBtn.addEventListener('click', () => {
  blindOverlay.classList.remove('show');
  clearInterval(blindSpinTimer);
});
blindOverlay.addEventListener('click', (e) => {
  if(e.target === blindOverlay){
    blindOverlay.classList.remove('show');
    clearInterval(blindSpinTimer);
  }
});
blindCopyBtn.addEventListener('click', () => {
  if(!blindCurrentSong) return;
  const text = `点歌 ${blindCurrentSong.title}`;
  const done = () => {
    showToast(`已复制「${blindCurrentSong.title}」`);
    blindCopyBtn.classList.add('copied');
    blindCopyBtn.textContent = '已复制';
    setTimeout(() => {
      blindCopyBtn.classList.remove('copied');
      blindCopyBtn.textContent = '复制点歌';
    }, 1400);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
});

renderHome();
renderHomeSearch('');
</script>
</body>
</html>
